# ============================================================================
# 数据集叠加配置：METC 洗手数据集（跨场景测试）
# ----------------------------------------------------------------------------
# 链接：https://zenodo.org/records/5808789
# 规模：212 段视频，约 2.1 GB，72 名参与者，实验室环境，帧级标签。
#
# 【重要】METC 在这里的角色是"跨场景测试集"，不是训练集。
#   正确用法：
#     1) 用 PSKUS 训练模型（configs/data/pskuss.yaml）；
#     2) 把 METC 的帧准备好后，作为 external split 评估：
#            python -m handwash.cli evaluate config=configs/experiments/exp04_cross_domain.yaml \
#                --checkpoint outputs/e4_cross_domain/models/best.pt --splits test external
#   不要用 METC 训练再在 METC 上测试 —— 那就不是跨场景实验了。
#
# Zenodo 发布结构：Interface_number_1..3 下为视频及同 stem 的逐帧 JSON 标注。
# movement code: 0=other, 1..6=WHO 六步；公开子集没有 faucet_on/off 标签。
# ============================================================================

dataset:
  name: metc
  root: data/raw/metc
  label_space: metc_public  # 7 类：六步 + other，与公开标注一致
  include_non_wash: true
  prep:
    # Match the 2 fps PSKUS cadence used by exp04's GRU checkpoint so each
    # temporal window covers a comparable amount of real time at evaluation.
    fps: 2.0
    resize_hw: [224, 224]
    min_frames_per_clip: 10

datasets:
  metc:
    # 全部 METC clip 作为 external 评估集，不按训练/验证比例拆分。
    external_only: true

split:
  group_key: original_video
  # 跨场景评估时，全部数据都进 external；比例仍需合法（校验要求和为 1）
  train: 0.70
  val: 0.15
  test: 0.15
  max_frames_per_clip_train: 200
  max_frames_per_clip_eval: 150

eval:
  splits: [external]
  extra_datasets: []

assess:
  min_total_duration_s: 40.0
  duration_check: ratio
