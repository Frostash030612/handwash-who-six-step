# 当前主线的 PSKUS 数据准备配置。叠加在 configs/config.yaml 上使用：
#   python scripts/prepare_data.py config=configs/data/pskuss.yaml --inspect
#   python scripts/prepare_data.py config=configs/data/pskuss.yaml
# 与 configs/experiments/live_yolo_frame.yaml 使用相同的抽帧率、图像尺寸和标签空间。
# 原始数据应解压到 data/raw/pskuss/extracted/DataSet*/。

dataset:
  name: pskuss
  root: data/raw/pskuss/extracted
  label_space: pskuss
  include_non_wash: true
  prep:
    fps: 5.0
    frame_step: 1
    resize_hw: [224, 224]
    image_ext: jpg
    jpeg_quality: 85
    min_frames_per_clip: 10

# 两名独立标注者一致，且远离动作切换边界的帧才进入正式训练集。
# 这会减少样本量，但避免把过渡画面硬标为某一个 WHO 步骤。
datasets:
  pskuss:
    annotators: [Annotator1, Annotator2]
    quality_filter:
      enabled: true
      stable_radius_frames: 7
