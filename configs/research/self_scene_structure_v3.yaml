format: self-scene-structure-v3/1
base_protocol: configs/research/self_scene_boundary_v2.yaml
stages: [boundary_mlp, boundary_multiscale, refine_no_boundary, refine_boundary, refine_no_boundary_smooth, refine_boundary_smooth]
seeds: [20261018, 20261019, 20261020]
backbone_policy: frozen_v2_gru_same_seed
selection:
  boundary: validation_direct_head_boundary_f1_then_lower_boundary_loss
  refinement: validation_composite_0.4_macro_f1_0.3_chain_0.3_decoded_boundary_f1
  tie_policy: keep_earliest
  final: highest_mean_validation_composite_among_refiners
architecture:
  channels: 64
  dilations: [1, 2, 4]
  dropout: 0.1
training:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  max_epochs: 50
  patience: 10
  direct_boundary_weight: 0.2
  interval_boundary_weight: 0.2
  positive_weight_cap: 20.0
  interval_max_gap: 3
  consistency_weight: 0.1
  consistency_truncate: 4.0
boundary_peak_grid:
  thresholds: [0.3, 0.5, 0.7]
  min_gaps: [3, 5]
refinement_decoder: raw
evaluation:
  no_regression_selection: true
  new_independent_test_videos: reserved_not_available
  keep_v2_action_chain_and_boundary_tolerance: true
  export_same_checkpoint_boundary_ablation: true
