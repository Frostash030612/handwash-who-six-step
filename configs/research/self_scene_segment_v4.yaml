format: self-scene-segment-v4/1
source: self_scene_structure_v3
seeds: [20261018, 20261019, 20261020]
validation: [10, 12, 14, 16, 18, 20, 22, 24]
regression: [4, 8]
continuous: [4, 8, 10, 12, 14, 16]
decoder:
  sample_fps: 5.0
  boundary_cost_cap: 4.0
  preferred_action_seconds: 3.0
  background_class: 0
grid:
  change_penalty: [1.0, 3.0, 6.0]
  short_action_penalty_per_second: [0.0, 2.0, 4.0]
  boundary_weight: [0.0, 0.5, 1.0]
selection:
  scope: one_shared_config_per_family_across_three_seeds
  families: [without_boundary, with_boundary]
  score: {macro_f1: 0.4, continuous_chain_match_rate: 0.3, boundary_f1: 0.3}
  tie: higher_macro_f1_then_boundary_f1_then_lower_penalties
  validation_only: true
  regression_opened_after_selection_is_written: true
evaluation:
  boundary_tolerance_s: 0.4
  segment_iou: 0.5
  action_chain_smoothing_seconds: 1.0
  action_chain_min_seconds: 3.0
  no_canonical_order: true
  preserve_raw_probabilities: true
  new_independent_test_evaluated: false
