# ============================================================================
# 模型叠加配置：YOLO26n-cls + GRU（本项目主方案）
# ----------------------------------------------------------------------------
# 对应选题文档：主模型 YOLO26n-cls 负责逐帧分类，GRU 负责利用前后帧关系。
# 官方文档：
#     https://docs.ultralytics.com/models/yolo26
#     https://docs.ultralytics.com/tasks/classify
#
# 若 yolo26 权重尚未发布，本适配器支持把 pretrained 指向替代权重：
#     model.pretrained: yolo11n-cls.pt      # 或 yolov8n-cls.pt
# 换权重**只改配置**，代码路径完全一致（这样实验可比较）。
# ============================================================================

model:
  name: yolo26n-cls
  arch: yolo26n-cls
  pretrained: auto
  image_size: 224
  normalize: zero_one      # 关键：ultralytics 内部已归一化
  dropout: 0.2
  temporal:
    kind: gru
    hidden_size: 128
    num_layers: 1
    bidirectional: false   # 保持单向：可在实时演示中使用
    window: 16
    stride: 8
    dropout: 0.1

train:
  mode: clip               # 走时序训练路径
  batch_size: 16           # clip 模式的 batch = 窗口数 × 窗口长度，显存占用更大
  eval_batch_size: 16
  lr: 0.0002
  epochs: 30
  precision: fp16
  class_weights: balanced
