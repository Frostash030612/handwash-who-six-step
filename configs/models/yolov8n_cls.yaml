# ============================================================================
# 模型叠加配置：YOLOv8n-cls 基线（现成可用的 YOLO 分类权重）
# ----------------------------------------------------------------------------
# 用途：即使 yolo26 权重尚未发布，也能立刻跑出"YOLO 系列分类模型"的基线数字，
#       用于和 MobileNetV2、以及最终的主模型对比。
# ============================================================================

model:
  name: yolon-cls
  arch: yolon-cls
  pretrained: yolov8n-cls.pt   # 显式指定权重名，便于在报告里写清楚
  image_size: 224
  normalize: zero_one
  dropout: 0.2
  temporal:
    kind: mean_pool

train:
  mode: frame
  batch_size: 32
  lr: 0.0003
  epochs: 20
  precision: fp16
