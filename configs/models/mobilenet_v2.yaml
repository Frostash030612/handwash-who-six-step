# ============================================================================
# 模型叠加配置：MobileNetV2 基线（选题文档指定的基线之一）
# ----------------------------------------------------------------------------
# 用法：
#     python -m handwash.cli train config=configs/config.yaml \
#         （把本文件与基础配置合并的方式见 scripts/train.py 的 --extra 参数）
#
# 说明：MobileNetV2 走 torchvision 预训练权重（ImageNet），因此
#       **normalize 必须是 imagenet**；这与 YOLO 适配器的 zero_one 不同。
#       用错会导致准确率明显偏低，`handwash doctor` 会检查这一点。
# 论文基线参考：https://github.com/edi-riga/handwash
# ============================================================================

model:
  name: mobilenet_v2
  arch: mobilenet_v2
  pretrained: auto         # torchvision 的 ImageNet 权重（首次需联网下载一次）
  image_size: 224
  normalize: imagenet
  dropout: 0.2
  temporal:
    kind: none             # 纯帧级分类：作为"没有时序处理"的下界

train:
  mode: frame
  batch_size: 64
  lr: 0.0005
  epochs: 25
  precision: fp16
