# ============================================================================
# 实验 E2：主模型 —— YOLO26n-cls（逐帧）+ GRU（时序）
# ----------------------------------------------------------------------------
# 目的：本项目主方案。YOLO26n-cls 负责逐帧动作分类，GRU 利用前后帧关系。
#
# 运行：
#     python -m handwash.cli train config=configs/experiments/exp02_yolo26n_gru.yaml
#
# 若 yolo26 权重不可用（先跑 handwash doctor 确认），做两步：
#     1) 把 model.arch 和 model.pretrained 一起改为 yolon-cls / auto，再训练；
#     2) 评估时加载同一配置，并在报告里说明实际使用 YOLO11n。
# 不要只改 pretrained 文件路径：不同 YOLO 架构的层形状不兼容。
# ============================================================================

runtime:
  run_name: e2_yolo26n_gru
  device: cuda               # fp16 训练需要 CUDA；无 CUDA 时可覆盖为 fp32 + cpu/mps

dataset:
  name: pskuss
  root: data/raw/pskuss/extracted
  label_space: pskuss
  include_non_wash: true

model:
  arch: yolo26n-cls
  pretrained: auto
  image_size: 224
  normalize: zero_one
  temporal:
    kind: gru
    hidden_size: 128
    num_layers: 1
    bidirectional: false
    window: 16
    dropout: 0.1

train:
  mode: clip
  epochs: 30
  batch_size: 16
  eval_batch_size: 16
  lr: 0.0002
  precision: fp16
  class_weights: balanced

infer:
  mode: clip
  temporal_apply: true
  smooth_window: 9
