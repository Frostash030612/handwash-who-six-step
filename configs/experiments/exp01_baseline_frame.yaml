# ============================================================================
# 实验 E1：单帧基线 —— MobileNetV2 + Kaggle 数据
# ----------------------------------------------------------------------------
# 目的：建立"没有时序处理"的下界，回答"加入时序信息能否减少单帧误判"。
# 对应论文基线：https://github.com/edi-riga/handwash（MobileNetV2）
#
# 运行：
#     python -m handwash.cli prepare config=configs/experiments/exp01_baseline_frame.yaml
#     python -m handwash.cli train config=configs/experiments/exp01_baseline_frame.yaml
#
# 报告里必须写明：数据集 = Kaggle，划分按原始视频，seed = 42，增强开关见 augment。
# ============================================================================

runtime:
  run_name: e1_mobilenet_frame

dataset:
  name: kaggle
  root: data/raw/kaggle
  label_space: kaggle
  include_non_wash: false

model:
  name: mobilenet_v2
  arch: mobilenet_v2
  pretrained: auto
  normalize: imagenet
  image_size: 224
  temporal:
    kind: none

train:
  mode: frame
  epochs: 25
  batch_size: 64
  lr: 0.0005
  precision: fp32            # 可在 CPU / Apple Silicon / CUDA 上运行
  class_weights: none
