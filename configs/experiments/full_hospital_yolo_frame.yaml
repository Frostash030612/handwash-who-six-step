# Seven-class full-data YOLO frame classifier. Build the combined manifest with
# scripts/build_full_hospital_dataset.py; do NOT run prepare_data.py on this profile.
runtime:
  run_name: full_hospital_yolo_frame
  device: auto

dataset:
  name: hospitals_full
  root: data/processed/hospitals_full_7class
  label_space: who7  # 0=other, 1..6=WHO; matches the Ultralytics folders
  include_non_wash: true

model:
  name: yolo26n-cls
  arch: yolo26n-cls
  pretrained: auto
  image_size: 224
  normalize: zero_one
  temporal:
    kind: none

train:
  mode: frame
  epochs: 30
  batch_size: 32
  precision: fp32
  class_weights: balanced

infer:
  mode: frame
  temporal_apply: false
  smooth_window: 9
