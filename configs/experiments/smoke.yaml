# ============================================================================
# 实验配置：冒烟测试（30 秒内跑完，只验证代码链路）
# ----------------------------------------------------------------------------
# 用法：make train-smoke
#       python -m handwash.cli train config=configs/experiments/smoke.yaml
#
# 特点：
#   * 合成数据集（不需要下载任何真实数据、不需要网络）
#   * 极小模型 + 2 个 epoch + CPU
#   * **指标没有意义**，只用来确认"数据 -> 模型 -> 指标 -> 报告"没断
#
# 新组员第一天跑通它，再去下载真实数据集。
# ============================================================================

runtime:
  device: cpu
  num_workers: 0           # Windows + 合成小数据：0 最稳
  run_name: smoke
  seed: 42

dataset:
  name: synthetic
  root: data/interim/synthetic
  label_space: synthetic   # 6 类，与合成数据一致

split:
  train: 0.6
  val: 0.2
  test: 0.2
  max_frames_per_clip_train: 40
  max_frames_per_clip_eval: 20

model:
  name: mobilenet_v2
  arch: mobilenet_v2
  pretrained: false        # 不联网：随机初始化，只验证链路
  image_size: 64
  normalize: imagenet
  dropout: 0.0
  temporal:
    kind: mean_pool

train:
  mode: frame
  epochs: 2
  batch_size: 32
  eval_batch_size: 64
  lr: 0.001
  precision: fp32
  class_weights: none
  early_stopping_patience: 3
  augment:
    random_resized_crop: false
    horizontal_flip: false
    color_jitter: 0.0
    rotation_deg: 0.0
    gaussian_blur: 0.0

eval:
  splits: [val, test]
  save_confusion_matrix: true
  save_predictions: false

assess:
  min_total_duration_s: 2.0      # 合成片段很短，阈值同步下调
  reference_total_duration_s: 5.0
  min_segment_frames: 2
  min_segment_s: 0.2
  duration_check: ratio
