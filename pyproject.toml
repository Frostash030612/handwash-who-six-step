# ============================================================================
# pyproject.toml —— 项目的唯一元数据与工具配置来源（Single Source of Truth）
# ----------------------------------------------------------------------------
# 规则（详见 CONTRIBUTING.md R3）：
#   1. 版本号只在 [project].version 写一次，其他地方一律 import handwash.__version__。
#   2. 依赖"宽松范围"写在这里；实验可复现的"精确锁定"写在 environment.yml。
#   3. 任何工具配置（pytest / ruff / mypy）都必须放在本文件，禁止新增
#      pytest.ini / setup.cfg / .flake8 等分散配置文件。
# ============================================================================

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handwash"
version = "0.1.0"
description = "基于视频的 WHO 六步洗手动作识别与完整性评估（classification + temporal assessment）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Group Project PRS" }]
keywords = ["hand-hygiene", "WHO-six-steps", "video-classification", "YOLO26", "temporal-model"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# --- 运行时依赖（宽松范围；精确锁定见 environment.yml）---------------------
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# 深度学习后端：装了才能训练/推理（framework 层之外允许 import torch）
torch = ["torch>=2.2", "torchvision>=0.17"]
# YOLO26 后端（主模型）。需要 torch。
yolo = ["ultralytics>=8.3"]
# 视频解码（缺省时 io/video.py 自动回退到 imageio-ffmpeg）
video = ["opencv-python>=4.9"]
# 绘图 / notebook 实验
viz = ["matplotlib>=3.8", "jupyterlab>=4.0"]
# 开发与质量门禁
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
# 一键装齐
all = [
  "handwash[torch,yolo,video,viz,dev]",
]

[project.scripts]
handwash = "handwash.cli:main"

[project.urls]
"项目计划" = "docs/PROJECT_PLAN.md"
"修改规则" = "CONTRIBUTING.md"
"架构说明" = "docs/ARCHITECTURE.md"

# ============================================================================
# setuptools —— src-layout：只打包 src/handwash，根目录脚本一律不打包
# ============================================================================
[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["handwash*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
handwash = ["py.typed"]

# ============================================================================
# pytest —— 只允许一个测试目录 tests/，且必须与 src/ 分层对应
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# 让 `python -m pytest` 在**没有 pip install -e . **的情况下也能跑：
#   src  -> 能 import handwash（src-layout）
#   .    -> tests 下可以用 `from tests.conftest import ...` 这类绝对导入
# 兼容 pytest 的 pythonpath 配置项（pytest>=7.0）。
pythonpath = ["src", "."]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "-q",
]
markers = [
  "unit: 纯函数/契约测试，无 IO、无 GPU、必须秒级完成",
  "integration: 需要真实数据集（设置 HANDWASH_DATA_ROOT 后才会运行）",
  "slow: 训练或推理级别，默认跳过（-m 'not slow'）",
  "gpu: 需要 CUDA",
]
filterwarnings = [
  "error::DeprecationWarning:handwash.*",
]

[tool.coverage.run]
source = ["src/handwash"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

# ============================================================================
# ruff —— 代码风格的唯一裁决者（lint + format）
# ============================================================================
[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["data", "outputs", "models", "*.ipynb"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports —— 用于强制分层依赖
  "PTH", # flake8-use-pathlib
  "RUF",
]
ignore = [
  "E501",  # 行长由 formatter 处理
  "B008",  # 允许 typer/argparse 风格的函数内默认值
]

[tool.ruff.lint.isort]
known-first-party = ["handwash"]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
# 分层依赖的机器可读版本；人类可读版本见 docs/ARCHITECTURE.md
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "TID252"]
"scripts/*" = ["TID252"]

# ============================================================================
# mypy —— 先对 core/ 强制类型检查，其余模块逐步收紧
# ============================================================================
[tool.mypy]
python_version = "3.10"
files = ["src/handwash/core", "src/handwash/io"]
strict = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch.*", "torchvision.*", "ultralytics.*", "cv2.*", "imageio.*"]
ignore_missing_imports = true
