[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handwash"
version = "0.1.0"
description = "Self-recorded handwashing recognition and adaptive boundary-aware action assessment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "Group Project PRS"}]
dependencies = ["numpy>=1.26,<3", "Pillow>=10.0", "PyYAML>=6.0", "pandas>=2.0", "scikit-learn>=1.3", "tqdm>=4.66"]

[project.optional-dependencies]
torch = ["torch>=2.2", "torchvision>=0.17"]
yolo = ["ultralytics>=8.3"]
video = ["opencv-python>=4.9", "imageio-ffmpeg>=0.4.9"]
compare = ["handwash[torch,yolo,video]", "transformers>=4.40,<5", "safetensors>=0.4"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["handwash*"]

[tool.setuptools.package-data]
handwash = ["py.typed", "static/*.html", "static/*.js"]
