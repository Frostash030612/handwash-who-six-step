name: Release integrity
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the source release
        run: python scripts/check_release.py
